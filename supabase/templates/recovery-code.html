<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset your password · DVC Court Play</title>
</head>
<body style="margin:0;background-color:#101314;color:#f1f2ed;font-family:Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="#101314">
    <tr>
      <td align="center" style="padding:24px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="#191d1f" style="max-width:520px;border:1px solid #303638;border-radius:12px;">
          <tr>
            <td style="padding:24px;border-bottom:1px solid #303638;color:#eccb73;font-size:15px;font-weight:bold;">
              DVC Court Play
            </td>
          </tr>
          <tr>
            <td style="padding:24px;">
              <h1 style="margin:0 0 12px;color:#f1f2ed;font-size:26px;line-height:1.2;">Reset your password</h1>
              <p style="margin:0 0 20px;color:#f1f2ed;font-size:16px;line-height:1.5;">Enter this code in DVC Court Play to choose a new password.</p>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="#2c281e" style="border:1px solid #635333;border-radius:8px;">
                <tr>
                  <td align="center" style="padding:16px;color:#eccb73;">
                    <div style="font-size:13px;line-height:1.5;">Your password reset code</div>
                    <strong style="font-family:Consolas,monospace;font-size:30px;line-height:1.4;letter-spacing:3px;">{{ .Token }}</strong>
                  </td>
                </tr>
              </table>
              <p style="margin:20px 0 0;color:#a5adae;font-size:14px;line-height:1.5;">Keep this code private. If you didn’t request it, you can ignore this email.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 24px;border-top:1px solid #303638;color:#a5adae;font-size:14px;line-height:1.5;">
              <strong style="color:#f1f2ed;">Dreamers Volleyball Club</strong><br>
              <a href="https://dvc-psi.vercel.app/" style="color:#eccb73;text-decoration:underline;">Visit DVC Court Play</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
